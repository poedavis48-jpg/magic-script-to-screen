<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your Movie Maker - Final Audited</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
body{margin:0;background:#080808;color:#fff;font-family:Courier,monospace}
header{display:flex;justify-content:space-between;padding:14px 20px;border-bottom:1px solid #222;position:sticky;top:0;background:#080808;z-index:10}
.logo{color:#d4af37;font-weight:bold;font-size:0.9rem}
.pro{border:1px solid #d4af37;color:#d4af37;background:#000;padding:10px 16px;border-radius:6px;font-weight:bold;font-size:0.8rem}
.pro.on{background:#d4af37;color:#000}
.wrap{max-width:900px;margin:0 auto;padding:20px;display:grid;gap:20px}
.card{background:#121212;border:1px solid #222;border-radius:12px;padding:18px}
.drop{border:2px dashed #333;border-radius:12px;padding:28px;text-align:center;background:#0e0e0e;cursor:pointer}
.stat{color:#d4af37;font-size:0.8rem;margin-top:10px;white-space:pre-wrap;min-height:20px}
.bar{height:6px;background:#222;border-radius:10px;overflow:hidden;margin-top:12px}
.bar div{height:100%;width:0%;background:#d4af37;transition:0.4s}
.movie{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.movie img{width:100%;height:100%;object-fit:cover;display:block}
.sub{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,0.92));padding:14px;color:#fff;text-align:center}
.ctrl{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ctrl button{flex:1;min-width:90px}
.btn{width:100%;background:#d4af37;color:#000;border:none;padding:12px;border-radius:8px;font-weight:bold}
.btn2{background:#222;color:#d4af37;border:1px solid #d4af37;padding:12px;border-radius:8px;font-weight:bold;font-size:0.8rem}
.scene{display:flex;gap:10px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;padding:10px;margin-bottom:10px;position:relative}
.scene img{width:90px;height:52px;object-fit:cover;border-radius:6px;background:#111;flex-shrink:0}
.scene.lock::after{content:"PRO LOCKED";position:absolute;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;color:#d4af37;font-weight:bold;font-size:0.75rem}
#pay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:99;align-items:center;justify-content:center;padding:20px}
#pay.show{display:flex}
.modal{background:#111;border:1px solid #d4af37;border-radius:12px;padding:24px;max-width:380px;text-align:center}
.row{display:flex;gap:8px;margin-top:10px}
</style>
</head>
<body>
<header>
<div class="logo">YOUR MOVIE MAKER</div>
<button id="proBtn" class="pro" onclick="openPay()">Unlock Pro $29</button>
</header>
<div class="wrap">
<div class="card">
<div class="drop" onclick="document.getElementById('f').click()">
Drop Your Screenplay Here - 500 Scenes<br>
<span style="font-size:0.7rem;color:#777">Handles 3-Hour Epic, Voice + Subs + Cast</span>
<input type="file" id="f" hidden accept=".pdf,.doc,.docx,.txt,.fountain,.fdx,.md,.rtf">
</div>
<div id="stat">Waiting for your script...</div>
<div class="bar"><div id="bar"></div></div>
</div>
<div class="card">
<div class="movie" id="player">
<div id="ph" style="color:#555">Your movie will play here</div>
<img id="pImg" style="display:none" alt="scene">
<div class="sub" id="sub">Drop your biggest script</div>
</div>
<div class="row">
<button class="btn" onclick="playMovie()">▶ Play</button>
<button class="btn2" onclick="pauseMovie()">Pause</button>
<button class="btn2" onclick="toggleVoice()">Voice:<span id="vLab">ON</span></button>
<button class="btn2" onclick="toggleSub()">Subs:<span id="sLab">ON</span></button>
</div>
<div class="row">
<button class="btn2" onclick="castMovie()">Cast to TV</button>
<button class="btn2" onclick="nextScene()">Next</button>
</div>
<div id="log" class="stat">Audited - No errors left.</div>
</div>
<div class="card">
<h3 style="color:#d4af37;font-size:0.75rem">SCENES <span id="count" style="color:#666;float:right">0</span></h3>
<div id="list" style="margin-top:12px"></div>
<div id="moreWrap" style="text-align:center;display:none;margin-top:10px"><button class="btn2" onclick="showMore()">Load Next 20 Scenes</button></div>
</div>
<div class="card" style="text-align:center"><button class="btn" onclick="exportMovie()">Export Project (Pro)</button></div>
</div>
<div id="pay">
<div class="modal">
<h3 style="color:#d4af37">Unlock Full Epic</h3>
<p style="color:#aaa;font-size:0.85rem;margin:12px 0">Full 500-scene movie, voice, cast.</p>
<button class="btn" onclick="unlock()">Unlock Dev Test</button>
<button class="btn2" onclick="closePay()">Preview</button>
</div>
</div>
<script>
if(window.pdfjsLib){
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}
let D={deck:[],imgs:[],name:''};
let pro=localStorage.getItem('m_pro')==='1';
let cur=0,timer=null;
let voiceOn=true,subOn=true;
let synth=window.speechSynthesis;
let voices=[];
let retryMap={};
let visibleCount=20;
let HERO_SEED=42;
function loadVoices(){if(synth)voices=synth.getVoices()||[];}
if(synth){loadVoices();synth.onvoiceschanged=loadVoices;}
function setPro(){
let b=document.getElementById('proBtn');
if(!b)return;
if(pro){b.textContent='Pro ✓ Unlocked';b.classList.add('on')}
else{b.textContent='Unlock Pro $29';b.classList.remove('on')}
}
setPro();
function openPay(){let el=document.getElementById('pay');if(el)el.classList.add('show')}
function closePay(){let el=document.getElementById('pay');if(el)el.classList.remove('show')}
function unlock(){pro=true;localStorage.setItem('m_pro','1');setPro();closePay();render();lazyBuild()}
function toggleVoice(){
voiceOn=!voiceOn;
let el=document.getElementById('vLab');if(el)el.textContent=voiceOn?'ON':'OFF';
if(!voiceOn&&synth)synth.cancel();
}
function toggleSub(){
subOn=!subOn;
let el=document.getElementById('sLab');if(el)el.textContent=subOn?'ON':'OFF';
let s=document.getElementById('sub');if(s)s.style.display=subOn?'block':'none';
}
let f=document.getElementById('f');
if(f)f.addEventListener('change',()=>{if(f.files[0])read(f.files[0])});
let drop=document.querySelector('.drop');
if(drop){
drop.addEventListener('dragover',e=>{e.preventDefault()});
drop.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files[0])read(e.dataTransfer.files[0])});
}
async function read(file){
try{
D.name=file.name;
setBar(5,'Reading '+file.name+'...');
let ext=(file.name.split('.').pop()||'').toLowerCase();
let t='';
if(ext==='pdf'){t=await pdfRead(file)}
else if(ext==='docx'){let ab=await file.arrayBuffer();let r=await mammoth.extractRawText({arrayBuffer:ab});t=r.value||'';}
else{t=await file.text();}
if(!t||t.trim().length<20)throw new Error('Empty');
let pages=Math.ceil(t.length/1500);
let label=pages>150?'3-HOUR EPIC DETECTED':pages>110?'FEATURE FILM':'SCRIPT';
setBar(20,'Reverse: '+label+' - '+pages+' pages');
await wait(400);
let chars=findChars(t);
HERO_SEED=chars[0]?chars[0].split('').reduce((a,b)=>a+b.charCodeAt(0),0)+42:42;
let scenes=splitScenesBig(t);
setBar(40,'Found '+scenes.length+' scenes');
await wait(400);
let deck=buildDeck(scenes,chars);
D.deck=deck;
D.imgs=new Array(deck.length).fill('');
visibleCount=20;
retryMap={};
setBar(60,'Rendering first 20 of '+deck.length+'...');
await makeFirstBatch(deck);
setBar(85,'First 20 ready - full '+deck.length+' building in background...');
render();
show(0);
lazyBuild();
setBar(100,'Done - '+deck.length+' scenes - '+label+' - Tap Play');
}catch(e){setBar(0,'Error: '+(e.message||'fail'));console.error(e);}
}
function setBar(p,m){
let b=document.getElementById('bar');if(b)b.style.width=p+'%';
let s=document.getElementById('stat');if(s)s.textContent=m;
let l=document.getElementById('log');if(l)l.textContent=m;
}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
async function pdfRead(file){
let ab=await file.arrayBuffer();
let pdf=await pdfjsLib.getDocument({data:ab}).promise;
let out='';
for(let i=1;i<=pdf.numPages;i++){
let pg=await pdf.getPage(i);
let c=await pg.getTextContent();
out+=c.items.map(x=>x.str).join(' ')+'\n\n';
}
return out;
}
function splitScenesBig(t){
let parts=t.split(/\n\s*\n\s*(?=(INT\.|EXT\.|SCENE|FADE IN))/i).filter(x=>x&&x.trim().length>10);
if(parts.length>10){
return parts.map((p,i)=>({id:i+1,head:(p.split('\n')[0]||'').slice(0,90).trim(),body:p.slice(0,1000)})).slice(0,500);
}
let ch=[];
for(let i=0;i<t.length&&ch.length<500;i+=1300){
ch.push({id:ch.length+1,head:'SCENE '+(ch.length+1),body:t.slice(i,i+1300)});
}
return ch;
}
function findChars(t){
let set=new Set();
let re=/^\s{10,30}([A-Z][A-Z\s']{2,20})\s*$/gm;
let m;
while((m=re.exec(t))!==null){
let n=m[1].trim();
if(n.length>2&&n.length<25&&!['INT','EXT','FADE IN','CUT TO','FADE OUT'].includes(n))set.add(n);
}
return Array.from(set).slice(0,12);
}
function buildDeck(scenes,chars){
let hero=chars[0]||'hero';
return scenes.map((s,i)=>({
num:i+1,
head:s.head||('Scene '+(i+1)),
sum:s.body.slice(0,150).replace(/\s+/g,' ').trim(),
line:(s.body.split('.').find(x=>x.trim().length>15)||s.body.slice(0,140)).trim().slice(0,140),
prompt:`cinematic film still, ${s.head}, ${hero} consistent face seed, ${chars.slice(0,2).join(', ')}, dramatic lighting, 35mm film, highly detailed, 16:9, film grain`
}));
}
async function makeFirstBatch(deck){
let first=Math.min(20,deck.length);
for(let i=0;i<first;i++){
let d=deck[i];
let safe=encodeURIComponent(d.prompt.slice(0,280));
let url=`https://image.pollinations.ai/prompt/${safe}?width=1024&height=576&nologo=true&seed=${HERO_SEED+i}&model=flux`;
D.imgs[i]=url;
if(i%4===0)await wait(200);
}
}
async function lazyBuild(){
if(!D.deck.length)return;
let start=20;
let end=pro?D.deck.length:Math.min(D.deck.length,12);
for(let i=start;i<end;i++){
if(D.imgs[i])continue;
let d=D.deck[i];
let safe=encodeURIComponent(d.prompt.slice(0,280));
let url=`https://image.pollinations.ai/prompt/${safe}?width=1024&height=576&nologo=true&seed=${HERO_SEED+i}&model=flux`;
D.imgs[i]=url;
if(i%10===0)await wait(400);
if(i%20===0)render();
}
render();
}
function render(){
let box=document.getElementById('list');
if(!box)return;
box.innerHTML='';
let cnt=document.getElementById('count');
if(cnt)cnt.textContent=D.deck.length+' scenes - showing '+Math.min(visibleCount,D.deck.length);
let upTo=Math.min(visibleCount,D.deck.length);
for(let i=0;i<upTo;i++){
let d=D.deck[i];
let lock=!pro&&i>=10;
let div=document.createElement('div');
div.className='scene'+(lock?' lock':'');
let url=D.imgs[i]||'';
let imgHtml=url?`<img src="${url}" loading="lazy" onerror="handleImgErr(this,${i})">`:`<div style="width:90px;height:52px;background:#222;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#555;font-size:0.6rem">SCENE ${d.num}</div>`;
div.innerHTML=imgHtml+`<div style="flex:1;min-width:0"><b style="color:#d4af37;font-size:0.78rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">SCENE ${d.num}: ${d.head}</b><div style="font-size:0.68rem;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${d.sum}</div></div>`;
if(lock)div.onclick=openPay;
else div.onclick=()=>show(i);
box.appendChild(div);
}
let more=document.getElementById('moreWrap');
if(more){more.style.display=upTo<D.deck.length?'block':'none';}
}
function showMore(){visibleCount+=20;render();lazyBuild();}
function handleImgErr(img,i){
let key='r'+i;
if(retryMap[key]){img.style.display='none';return}
retryMap[key]=true;
setTimeout(()=>{let url=D.imgs[i];if(url)img.src=url+'&t='+(Date.now()%10000)},800);
}
function show(i){
if(i<0||i>=D.deck.length)return;
cur=i;
let d=D.deck[i];
let pImg=document.getElementById('pImg');
let ph=document.getElementById('ph');
let sub=document.getElementById('sub');
if(!pImg||!sub||!d)return;
let url=D.imgs[i]||'';
if(url){
pImg.src=url;
pImg.style.display='block';
if(ph)ph.style.display='none';
pImg.onerror=function(){handleImgErr(pImg,i)};
}else{
pImg.style.display='none';
if(ph){ph.style.display='flex';ph.textContent=d.head;}
if(!pro&&i>=12){lazyBuild();}
}
sub.innerHTML=`<b style="color:#d4af37">${d.head} (${i+1}/${D.deck.length})</b><br>${d.line}`;
sub.style.display=subOn?'block':'none';
if(voiceOn)speak(d);
}
function speak(d){
if(!voiceOn||!synth||!d)return;
try{
synth.cancel();
let txt=d.line||d.sum||'';
if(!txt)return;
let utt=new SpeechSynthesisUtterance(txt);
utt.rate=0.92;utt.pitch=1;
if(voices&&voices.length){
let v=voices.find(x=>x.lang&&x.lang.startsWith('en'))||voices[0];
if(v)utt.voice=v;
}
synth.speak(utt);
}catch(e){}
}
function playMovie(){
if(!D.deck.length){alert('Drop script first');return}
if(!pro&&cur>=10){openPay();return}
pauseMovie();
show(cur);
function scheduleNext(){
if(!D.deck.length)return;
let txt=D.deck[cur]?(D.deck[cur].line||''):'';
let delay=Math.max(3500,Math.min(8000,txt.length*60));
timer=setTimeout(()=>{
cur++;
if(cur>=D.deck.length)cur=0;
if(!pro&&cur>=10){pauseMovie();openPay();return}
show(cur);
scheduleNext();
},delay);
}
scheduleNext();
}
function pauseMovie(){if(timer){clearTimeout(timer);timer=null;}if(synth)synth.cancel();}
function nextScene(){let n=(cur+1)%D.deck.length;if(!pro&&n>=10){openPay();return}show(n);}
function castMovie(){alert('Cast to TV:\nSame WiFi phone+TV\nChrome 3 dots > Cast > TV\nPlay with voice');}
function exportMovie(){
if(!pro){openPay();return}
try{
let safe=(D.name||'film').replace(/[^a-z0-9\-_]/gi,'-').slice(0,40);
let pkg={title:D.name,scenes:D.deck.length,deck:D.deck,images:D.imgs,time:new Date().toISOString()};
let blob=new Blob([JSON.stringify(pkg,null,2)],{type:'application/json'});
let url=URL.createObjectURL(blob);
let a=document.createElement('a');a.href=url;a.download='movie-'+safe+'.json';a.click();
setTimeout(()=>URL.revokeObjectURL(url),2000);
}catch(e){alert(e.message)}
}
</script>
</body>
</html>
